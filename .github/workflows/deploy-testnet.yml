name: deploy-testnet
# Deploys the seven contracts to BOT Chain testnet (968) from a GitHub runner, commits
# deployments/968.json and rebuilds the Pages site, which then opens on testnet by default
# (the in-browser demo stays in the network menu). Testnet only: mainnet is deployed by hand.
#
# Needs the repository secret DEPLOYER_KEY: a testnet-only wallet funded from the faucet.
# The key is read from the environment by scripts/deploy.mjs and never printed.
on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Broadcast the deployment (unchecked = dry run: chain id, deployer, balance, sizes)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: deploy-testnet
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy to testnet
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: node scripts/deploy.mjs --network testnet ${{ inputs.broadcast && '--yes' || '' }}
      - name: Commit deployments/968.json and rebuild Pages
        if: inputs.broadcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/968.json
          git commit -m "Deploy to BOT Chain testnet (968)" -m "From the deploy-testnet workflow, run ${GITHUB_RUN_ID}."
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
