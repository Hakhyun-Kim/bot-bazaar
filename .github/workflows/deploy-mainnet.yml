name: deploy-mainnet
# Deploys the first mainnet version, the free-only Pixel Workshop alone, to BOT Chain mainnet (677)
# from a GitHub runner, commits deployments/677.json and rebuilds the Pages site.
#
# Uses the repository secret DEPLOYER_KEY, the same wallet as testnet (owner's choice, 2026-10-14),
# hence --reuse-testnet-key. Run it unchecked first: the dry run prints chain id, deployer and balance.
on:
  workflow_dispatch:
    inputs:
      broadcast:
        description: "Broadcast the deployment (unchecked = dry run: chain id, deployer, balance, size)"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: deploy-mainnet
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy Pixel Workshop to mainnet
        env:
          DEPLOYER_KEY: ${{ secrets.DEPLOYER_KEY }}
        run: node scripts/deploy.mjs --network mainnet --only PixelWorkshop --reuse-testnet-key ${{ inputs.broadcast && '--yes' || '' }}
      - name: Commit deployments/677.json and rebuild Pages
        if: inputs.broadcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployments/677.json
          git commit -m "Deploy Pixel Workshop to BOT Chain mainnet (677)" -m "From the deploy-mainnet workflow, run ${GITHUB_RUN_ID}."
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
