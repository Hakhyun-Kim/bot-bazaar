<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BOT Bazaar</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fdcff"/>
      <stop offset="1" stop-color="#d9f3ff"/>
    </linearGradient>
    <clipPath id="tile"><rect x="0" y="0" width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- sunny ground -->
    <path d="M0 404 Q256 372 512 404 V512 H0Z" fill="#9ed97a"/>
    <path d="M0 448 Q256 420 512 448 V512 H0Z" fill="#f6e3b8"/>
    <!-- bunting -->
    <path d="M-10 34 Q256 84 522 34" fill="none" stroke="#3a2e3f" stroke-width="5"/>
    <g stroke="#3a2e3f" stroke-width="5" stroke-linejoin="round">
      <path d="M22 40 L62 47 L38 78Z" fill="#ffd166"/>
      <path d="M450 47 L490 40 L474 78Z" fill="#ffd166"/>
    </g>
  </g>
  <g stroke="#3a2e3f" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- posts -->
    <rect x="98" y="150" width="26" height="282" rx="8" fill="#c98a4b"/>
    <rect x="388" y="150" width="26" height="282" rx="8" fill="#c98a4b"/>
    <!-- robot trader, drawn from the in-game Robot model (World.tsx) -->
    <g stroke="#3a2e3f">
      <!-- arms waving -->
      <line x1="204" y1="368" x2="158" y2="282" stroke-width="30"/>
      <line x1="308" y1="368" x2="354" y2="282" stroke-width="30"/>
      <line x1="204" y1="368" x2="158" y2="282" stroke="#8d95a8" stroke-width="16"/>
      <line x1="308" y1="368" x2="354" y2="282" stroke="#8d95a8" stroke-width="16"/>
      <!-- body -->
      <rect x="198" y="330" width="116" height="80" rx="8" fill="#4fd1c5"/>
      <rect x="282" y="335" width="27" height="70" fill="#3fb3a9" stroke="none"/>
      <rect x="198" y="330" width="116" height="80" rx="8" fill="none"/>
      <!-- antenna -->
      <line x1="256" y1="242" x2="256" y2="214" stroke-width="16"/>
      <line x1="256" y1="242" x2="256" y2="214" stroke="#8d95a8" stroke-width="6"/>
      <circle cx="256" cy="204" r="13" fill="#4fd1c5"/>
      <!-- head -->
      <rect x="180" y="238" width="152" height="114" rx="12" fill="#eef1f7"/>
      <rect x="300" y="243" width="27" height="104" fill="#d6dbe6" stroke="none"/>
      <rect x="180" y="238" width="152" height="114" rx="12" fill="none"/>
      <!-- face screen -->
      <rect x="202" y="258" width="108" height="74" rx="10" fill="#2c3550" stroke="none"/>
      <circle cx="232" cy="290" r="13" fill="#8ff0ff" stroke="none"/>
      <circle cx="280" cy="290" r="13" fill="#8ff0ff" stroke="none"/>
      <rect x="241" y="312" width="30" height="7" rx="3.5" fill="#8ff0ff" stroke="none"/>
    </g>
  </g>
  <!-- awning -->
  <g stroke="#3a2e3f" stroke-width="10" stroke-linejoin="round" transform="translate(0 -46)">
    <path d="M64 216 L104 140 H408 L448 216Z" fill="#fff6e6"/>
    <g stroke="none" fill="#ef476f">
      <path d="M104 140 H142 L128 216 H64Z"/>
      <path d="M180 140 H218 L216 216 H164Z"/>
      <path d="M256 140 H294 L304 216 H256Z" transform="translate(-19 0)"/>
      <path d="M332 140 H370 L392 216 H340Z" transform="translate(-8 0)"/>
    </g>
    <path d="M64 216 L104 140 H408 L448 216Z" fill="none"/>
    <path d="M64 216 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0Z" fill="#ef476f"/>
    <path d="M64 216 q24 36 48 0 M160 216 q24 36 48 0 M256 216 q24 36 48 0 M352 216 q24 36 48 0" fill="#fff6e6" stroke="none"/>
    <path d="M64 216 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0 q24 36 48 0" fill="none"/>
  </g>
  <!-- counter with goods -->
  <g transform="translate(0 28)" stroke="#3a2e3f" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <!-- parcel -->
    <g transform="translate(-14 4)">
    <rect x="130" y="304" width="62" height="50" rx="8" fill="#ffb3c7"/>
    <line x1="161" y1="304" x2="161" y2="354" stroke="#ef476f" stroke-width="9"/>
    <path d="M161 302 q-20 -22 -26 -4 q10 8 26 4 q20 -22 26 -4 q-10 8 -26 4" fill="#ffd166" stroke-width="6"/>
    </g>
    <!-- pixel art frame -->
    <g transform="translate(12 4)">
    <rect x="322" y="298" width="60" height="56" rx="6" fill="#fffdf6"/>
    <g stroke="none">
      <rect x="334" y="310" width="12" height="12" fill="#ffd166"/>
      <rect x="346" y="322" width="12" height="12" fill="#ef476f"/>
      <rect x="358" y="310" width="12" height="12" fill="#6cc7cf"/>
      <rect x="334" y="334" width="12" height="9" fill="#9ed97a"/>
      <rect x="358" y="334" width="12" height="9" fill="#9ed97a"/>
    </g>
    </g>
    <rect x="80" y="350" width="352" height="96" rx="16" fill="#e9b872"/>
    <line x1="92" y1="384" x2="420" y2="384" stroke-width="6" stroke="#b97a3e"/>
    <line x1="92" y1="414" x2="420" y2="414" stroke-width="6" stroke="#b97a3e"/>
    <rect x="80" y="350" width="352" height="96" rx="16" fill="none"/>
  </g>
  <!-- outer frame -->
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#3a2e3f" stroke-width="12"/>
</svg>
